name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Firestore security rules
        run: pnpm run lint

      - name: Typecheck TypeScript
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build Next.js app
        run: pnpm run build

      - name: Run Firestore security rules tests against emulator
        run: pnpm dlx firebase-tools emulators:exec --only firestore --project cohort-security-test "pnpm run test:rules"
